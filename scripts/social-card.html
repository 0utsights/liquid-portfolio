<!doctype html>
<!-- Source for public/images/social-card.jpg (1200×630) and public/apple-touch-icon.png (180×180).
     Render at 1200×630 in a Chromium browser and save a screenshot; append #icon at 180×180 for the icon. -->
<html lang="en"><head><meta charset="utf-8"><title>Social card</title>
<style>
*{box-sizing:border-box}html,body{margin:0}
body{width:1200px;height:630px;display:grid;place-items:center;background:#357c96;font-family:Rubik,system-ui,'Segoe UI',Roboto,Arial,sans-serif;color:#212529}
.card{width:920px;padding:56px 64px;background:#fff;text-align:center}
.mark{display:grid;place-items:center;width:120px;height:120px;margin:0 auto 26px;border-radius:50%;background:#357c96;color:#fff;font-size:42px;font-weight:500;letter-spacing:.04em}
h1{margin:0;font-size:64px;font-weight:500;color:rgba(0,0,0,.87)}
.sub{margin:10px 0 0;font-size:30px;color:#5f6368}
.status{margin:30px 0 0;padding-top:26px;border-top:1px solid rgba(0,0,0,.16);font-size:26px}
body.icon{width:180px;height:180px;background:#357c96}
body.icon .card{display:none}
.icon-mark{display:none}body.icon .icon-mark{display:grid;place-items:center;width:180px;height:180px;color:#fff;font-size:72px;font-weight:500;letter-spacing:.04em}
</style></head>
<body>
<div class="card">
 <div class="mark">JS</div>
 <h1>John Surles</h1>
 <p class="sub">Software Engineering Student · Virginia Tech</p>
 <p class="status">Seeking a Summer 2027 software engineering internship</p>
</div>
<div class="icon-mark">JS</div>
<script>if (location.hash === '#icon') document.body.className = 'icon';</script>
</body></html>

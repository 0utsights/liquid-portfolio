<!doctype html>
<!-- Source for public/images/social-card.jpg (1200×630) and public/apple-touch-icon.png (180×180).
     Render at 1200×630 in a Chromium browser and save a screenshot; append #icon at 180×180 for the icon. -->
<html lang="en"><head><meta charset="utf-8"><title>Social card</title>
<style>
*{box-sizing:border-box}html,body{margin:0}
body{width:1200px;height:630px;display:grid;place-items:center;background:#f7f5f2;font-family:Rubik,system-ui,'Segoe UI',Roboto,Arial,sans-serif;color:#24201d}
.card{width:960px;padding:56px 64px;background:#fff;border:2px solid #e8e2db;border-radius:12px;display:flex;align-items:center;gap:56px}
.photo{width:220px;height:220px;border-radius:50%;object-fit:cover;flex:none;box-shadow:0 0 0 6px #fff,0 0 0 8px #e8e2db}
h1{margin:0;font-size:62px;font-weight:500;color:rgba(0,0,0,.87)}
.sub{margin:10px 0 0;font-size:28px;color:#685f57}
.status{margin:28px 0 0;padding-top:24px;border-top:2px solid #e8e2db;font-size:25px}
.status b{color:#9a4a1f;font-weight:500}
body.icon{width:180px;height:180px;background:#9a4a1f}
body.icon .card{display:none}
.icon-mark{display:none}body.icon .icon-mark{display:grid;place-items:center;width:180px;height:180px;color:#fff;font-size:72px;font-weight:500;letter-spacing:.04em}
</style></head>
<body>
<div class="card">
 <img class="photo" src="../public/images/profile.jpg" alt="">
 <div>
  <h1>John Surles</h1>
  <p class="sub">Software Engineering Student · Virginia Tech</p>
  <p class="status"><b>Seeking software engineering internships</b><br>Graduating May 2028</p>
 </div>
</div>
<div class="icon-mark">JS</div>
<script>if (location.hash === '#icon') document.body.className = 'icon';</script>
</body></html>
